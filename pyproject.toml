[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-coach"
version = "0.1.0"
description = "Open-source Fantasy Premier League team analyser: squad health, transfers, captaincy, chips and a season review from just your team ID."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David Chandika" }]
keywords = ["fpl", "fantasy premier league", "football", "fantasy football", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fpl-coach = "fpl_coach.cli:main"

[project.urls]
Homepage = "https://github.com/davidchands/fpl-coach"
Issues = "https://github.com/davidchands/fpl-coach/issues"

[tool.setuptools]
packages = ["fpl_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
