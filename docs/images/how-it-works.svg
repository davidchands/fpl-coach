<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a91a1"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="16" fill="#181a21"/>

  <!-- 1. FPL API -->
  <rect x="30" y="80" width="190" height="170" rx="12" fill="#232733" stroke="#3a3f4d"/>
  <text x="125" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Public FPL API</text>
  <text x="125" y="140" text-anchor="middle" font-size="13" fill="#a9b0bf">players · prices · xG</text>
  <text x="125" y="160" text-anchor="middle" font-size="13" fill="#a9b0bf">fixtures · difficulty</text>
  <text x="125" y="180" text-anchor="middle" font-size="13" fill="#a9b0bf">your picks &amp; history</text>
  <text x="125" y="222" text-anchor="middle" font-size="12" fill="#8ee6a8">read-only · no login</text>

  <!-- 2. client -->
  <rect x="270" y="80" width="190" height="170" rx="12" fill="#232733" stroke="#3a3f4d"/>
  <text x="365" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">api.py</text>
  <text x="365" y="140" text-anchor="middle" font-size="13" fill="#a9b0bf">fetches JSON</text>
  <text x="365" y="160" text-anchor="middle" font-size="13" fill="#a9b0bf">caches it on disk</text>
  <text x="365" y="180" text-anchor="middle" font-size="13" fill="#a9b0bf">friendly errors</text>
  <text x="365" y="222" text-anchor="middle" font-size="12" fill="#7ab2f7">the only network code</text>

  <!-- 3. analysis -->
  <rect x="510" y="40" width="210" height="250" rx="12" fill="#1f3a2c" stroke="#2f6b4a"/>
  <text x="615" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">analysis.py</text>
  <g font-size="13" fill="#d2f2dc">
    <text x="532" y="104">• projection model</text>
    <text x="548" y="122" fill="#a6c9b4" font-size="12">xG · xA · clean sheets</text>
    <text x="548" y="139" fill="#a6c9b4" font-size="12">+ form, × fixture difficulty</text>
    <text x="532" y="166">• squad health flags</text>
    <text x="532" y="190">• best XI &amp; captain</text>
    <text x="532" y="214">• transfer search</text>
    <text x="532" y="238">• chips · DGW / BGW</text>
    <text x="532" y="262">• season review</text>
  </g>

  <!-- 4. outputs -->
  <rect x="770" y="40" width="160" height="72" rx="12" fill="#232733" stroke="#3a3f4d"/>
  <text x="850" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Terminal report</text>
  <text x="850" y="92" text-anchor="middle" font-size="12" fill="#a9b0bf">fpl-coach analyze ID</text>
  <rect x="770" y="129" width="160" height="72" rx="12" fill="#232733" stroke="#3a3f4d"/>
  <text x="850" y="159" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">JSON</text>
  <text x="850" y="181" text-anchor="middle" font-size="12" fill="#a9b0bf">--json · build on it</text>
  <rect x="770" y="218" width="160" height="72" rx="12" fill="#232733" stroke="#3a3f4d" stroke-dasharray="5 4"/>
  <text x="850" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Python library</text>
  <text x="850" y="270" text-anchor="middle" font-size="12" fill="#a9b0bf">web app · bot · MCP</text>

  <!-- arrows -->
  <g stroke="#8a91a1" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="222" y1="165" x2="266" y2="165"/>
    <line x1="462" y1="165" x2="506" y2="165"/>
    <path d="M722,140 C745,140 745,76 766,76"/>
    <line x1="722" y1="165" x2="766" y2="165"/>
    <path d="M722,190 C745,190 745,254 766,254"/>
  </g>
</svg>
